<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>天道世界 · 看板</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1e222b; --line:#2a2f3a;
    --txt:#e8eaee; --dim:#98a1b0; --good:#39c07a; --warn:#e0a13a; --bad:#e05a5a; --accent:#6ea8fe;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{position:sticky;top:0;z-index:9;background:rgba(15,17,21,.96);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:600}
  .pill{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--dim)}
  .pill b{color:var(--txt);font-weight:600}
  main{padding:14px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));max-width:1400px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .card h2{font-size:13px;margin:0 0 10px;color:var(--dim);font-weight:600;letter-spacing:.04em}
  .row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.04)}
  .row:last-child{border-bottom:0}
  .row span:first-child{color:var(--dim)}
  .big{font-size:22px;font-weight:700}
  .good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:5px 6px;text-align:left;border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap}
  th{color:var(--dim);font-weight:500;font-size:12px}
  td.num{font-variant-numeric:tabular-nums}
  .tag{display:inline-block;border-radius:6px;padding:0 6px;font-size:11px;border:1px solid var(--line);color:var(--dim)}
  .bar{height:6px;background:#0c0e12;border-radius:4px;overflow:hidden;min-width:46px}
  .bar i{display:block;height:100%;background:var(--accent)}
  pre{white-space:pre-wrap;word-break:break-word;background:#0c0e12;border:1px solid var(--line);border-radius:8px;padding:10px;margin:0;font-size:12.5px;line-height:1.75;max-height:420px;overflow:auto}
  .full{grid-column:1/-1}
  button{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12px}
  button:hover{border-color:var(--accent)}
  input{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;width:260px}
  .ev{font-size:12.5px;color:var(--dim);padding:2px 0;border-bottom:1px dashed rgba(255,255,255,.04)}
  .ev b{color:var(--txt);font-weight:500}
  .muted{color:var(--dim);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>天道世界 · 看板</h1>
  <span class="pill">世界 <b id="h-clock">—</b></span>
  <span class="pill">时空 <b id="h-epoch">—</b></span>
  <span class="pill">体检 <b id="h-audit">—</b></span>
  <span class="pill" id="h-updated">—</span>
  <span style="flex:1"></span>
  <input id="token" placeholder="令牌（husband token）">
  <button onclick="saveToken()">保存</button>
  <button onclick="load()">刷新</button>
</header>

<main>
  <section class="card">
    <h2>运行状态</h2>
    <div class="row"><span>已运行</span><span id="r-uptime">—</span></div>
    <div class="row"><span>内存占用</span><span id="r-rss">—</span></div>
    <div class="row"><span>Node / PID / 端口</span><span id="r-node">—</span></div>
    <div class="row"><span>回执率（近20轮）</span><span id="r-receipt">—</span></div>
    <div class="row"><span>健康提示</span><span id="r-health">—</span></div>
  </section>

  <section class="card">
    <h2>花费</h2>
    <div class="row"><span>累计轮数</span><span id="c-rounds" class="big">—</span></div>
    <div class="row"><span>平均每轮输入</span><span id="c-avg">—</span></div>
    <div class="row"><span>缓存命中率</span><span id="c-hit">—</span></div>
    <div class="row"><span>估算花费</span><span id="c-cost" class="big">—</span></div>
    <div class="muted" id="c-note" style="margin-top:6px"></div>
  </section>

  <section class="card">
    <h2>家底</h2>
    <div class="row"><span>现银</span><span id="a-silver" class="big">—</span></div>
    <div class="row"><span>日入合计</span><span id="a-income" class="big">—</span></div>
    <div id="a-props"></div>
  </section>

  <section class="card">
    <h2>体检结果</h2>
    <div id="audit-box" class="muted">—</div>
  </section>

  <section class="card full">
    <h2>人物（数值 + 她此刻的态度）</h2>
    <table>
      <thead><tr><th>名字</th><th>身份</th><th>所在</th><th>信任</th><th>欲望</th><th>怨怼</th><th>态度</th><th>亲密</th></tr></thead>
      <tbody id="actors"></tbody>
    </table>
  </section>

  <section class="card">
    <h2>天机（她每轮看到的实况）</h2>
    <pre id="summary">—</pre>
  </section>

  <section class="card">
    <h2>最近事件</h2>
    <div id="events">—</div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (n) => new Intl.NumberFormat('zh-CN').format(Math.round(n));

function saveToken(){
  localStorage.setItem('fs_admin_token', $('token').value.trim());
  load();
}
function token(){
  const fromUrl = new URLSearchParams(location.search).get('token');
  if (fromUrl) { localStorage.setItem('fs_admin_token', fromUrl); return fromUrl; }
  return localStorage.getItem('fs_admin_token') || localStorage.getItem('surfcore_husband_token') || '';
}
function human(sec){
  if (!sec) return '—';
  const d = Math.floor(sec/86400), h = Math.floor(sec%86400/3600), m = Math.floor(sec%3600/60);
  return (d? d+'天':'') + (h? h+'小时':'') + m + '分';
}
// 与后端一致的态度阶梯（仅用于展示）
function attitude(a){
  const r = a.relations || {}; const d = +r.desire||0, t = +r.trust||0, g = +r.grievance||0;
  if (a.household) {
    if (g>=60) return '心里有气，会闹一场、要哄';
    if (d>=60) return '心里有你，主动迎合';
    if (d>=30) return '愿意服侍，会撒撒娇';
    return '虽有些倦，仍会应下';
  }
  if (g>=60) return '心里有怨，轻易不松口';
  if (a.consummated) return d>=50 ? '已是相好，嘴上推拒身子应' : '已是相好，脸皮薄';
  if (d>=70 && t>=55) return '心里已有你，半推半就';
  if (d>=45) return '有点意动，要给由头';
  if (t>=45) return '可信的人，但到此为止';
  if (d<=20 && t<=30) return '只是相识，第一次必拒';
  return '有意无意打量着';
}

async function load(){
  const tk = token();
  if (!tk) { $('summary').textContent = '请先在右上角填入令牌。'; return; }
  if (!$('token').value) $('token').value = tk;
  try {
    const r = await fetch(`/api/admin/world?token=${encodeURIComponent(tk)}`);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const w = await r.json();
    render(w);
    $('h-updated').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN');
  } catch (e) {
    $('h-updated').textContent = '读取失败：' + e.message;
  }
}

function render(w){
  $('h-clock').textContent = `第${w.clock.day}日 ${w.clock.hour}时（${w.clock.shichen||''}）`;
  $('h-epoch').textContent = w.epoch === 'modern' ? '现代' : '古代';
  const audit = w.audit || [];
  $('h-audit').textContent = audit.length ? audit.length + ' 个问题' : '正常';
  $('h-audit').className = 'pill';

  const rt = w.runtime || {};
  $('r-uptime').textContent = human(rt.uptimeSec);
  $('r-rss').textContent = rt.rssMB ? rt.rssMB + ' MB' : '—';
  $('r-node').textContent = rt.node ? `${rt.node} / ${rt.pid} / ${rt.port}` : '—';
  const rate = w.receiptRate ?? 0;
  $('r-receipt').textContent = Math.round(rate*100) + '%';
  $('r-receipt').className = rate >= 0.6 ? 'good' : rate >= 0.35 ? 'warn' : 'bad';
  $('r-health').textContent = w.health || '—';

  const c = w.cost || {};
  $('c-rounds').textContent = fmt(c.rounds || 0);
  $('c-avg').textContent = c.rounds ? fmt(c.promptTokens / c.rounds) + ' tokens' : '—';
  $('c-hit').textContent = (c.cacheHitRate ?? 0) + '%';
  const miss = c.cacheMissTokens||0, hit = c.cacheHitTokens||0, out = c.completionTokens||0;
  const yuan = miss/1e6*2 + hit/1e6*0.2 + out/1e6*8;
  $('c-cost').textContent = '¥' + yuan.toFixed(2);
  $('c-note').textContent = c.note || `按 DeepSeek 官方价估算（未命中¥2/M 命中¥0.2/M 输出¥8/M）；累计输入 ${fmt(c.promptTokens||0)} tokens`;

  $('a-silver').textContent = (w.assets?.silver ?? 0) + ' 两';
  const props = w.assets?.properties || [];
  const income = props.reduce((s,p)=>s+(+p.incomePerDay||0),0);
  $('a-income').textContent = income.toFixed(2) + ' 两/日';
  $('a-props').innerHTML = props.map(p =>
    `<div class="row"><span>${p.name}</span><span>${(+p.incomePerDay||0).toFixed(2)} 两 · ${p.status||''}</span></div>`).join('') || '<div class="muted">无产业</div>';

  $('audit-box').innerHTML = audit.length
    ? audit.map(x=>`<div class="row"><span class="bad">✗</span><span>${x}</span></div>`).join('')
    : '<span class="good">✓ 账本无异常（越界、失效、堆积、重名均未发现）</span>';

  const list = (w.actors||[]).slice().sort((a,b)=> (a.id==='husband'?-1:0)-(b.id==='husband'?-1:0));
  $('actors').innerHTML = list.map(a=>{
    const r = a.relations||{}, im = a.intimacy||{};
    const bar = v => `<div class="bar"><i style="width:${Math.max(0,Math.min(100,v))}%"></i></div>`;
    const intimacy = im.ritual==='unlocked' ? '解禁·档'+(im.tone??0) : (im.consummated?'相好':'端庄');
    return `<tr>
      <td><b>${a.name}</b></td><td class="muted">${a.role||''}</td><td class="muted">${a.place||''}</td>
      <td class="num">${r.trust??'—'} ${bar(r.trust||0)}</td>
      <td class="num">${r.desire??'—'} ${bar(r.desire||0)}</td>
      <td class="num">${r.grievance??0} ${bar(r.grievance||0)}</td>
      <td>${a.id==='husband'?'—':attitude({...a, household:a.household, consummated:im.consummated, relations:r})}</td>
      <td><span class="tag">${a.id==='husband'?'—':intimacy}</span></td>
    </tr>`;
  }).join('');

  $('summary').textContent = w.summary || '—';

  const evs = (w.recentEvents||[]).slice(-8).reverse();
  $('events').innerHTML = evs.map(e=>{
    const p = e.payload||{};
    const txt = p.text||p.desc||p.goal||p.name||'';
    return `<div class="ev"><b>第${e.day}日${e.hour}时</b> [${e.action}] ${txt}</div>`;
  }).join('') || '<div class="muted">暂无</div>';
}

$('token').value = token();
load();
setInterval(load, 30000);
</script>
</body>
</html>
