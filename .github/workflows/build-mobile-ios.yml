name: Build iOS IPA

# 只在"客户端代码真的变了"时才打包：lib 里的 Dart、依赖清单、iOS/Android 原生壳
# 改服务端、文档、脚本、看板 —— 一律不触发，省 macOS 机时
on:
  push:
    paths:
      - 'mobile/lib/**'                 # Dart 源码（改了必须重打）
      - 'mobile/pubspec.yaml'           # 依赖变了
      - 'mobile/pubspec.lock'
      - 'mobile/assets/**'              # 资源（图标、语音权重等）
      - 'mobile/ios/**'                 # iOS 原生壳
      - 'mobile/android/app/**'         # 安卓原生壳（改配置也一并出新包）
      - '.github/workflows/build-mobile-ios.yml'
  workflow_dispatch: # 也可以在网页上手动点一下

# 连续推送时只跑最新一次，前面没跑完的直接取消，不浪费机时
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build Unsigned IPA on macOS
    runs-on: macos-latest # 使用 GitHub 官方最新 macOS Apple Silicon 环境

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build unsigned iOS IPA
        run: |
          cd mobile
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r FamilySoul伴侣_iOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilySoul伴侣_iOS_未签名安装包
          path: mobile/build/ios/iphoneos/FamilySoul伴侣_iOS.ipa
          retention-days: 7
