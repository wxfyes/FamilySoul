name: Build iOS IPA

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-mobile-ios.yml'
  workflow_dispatch: # 支持在 GitHub 网页上一键手动点击触发构建

jobs:
  build-ios:
    name: Build Unsigned IPA on macOS
    runs-on: macos-latest # 使用 GitHub 官方最新 macOS Apple Silicon 环境

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build unsigned iOS IPA
        run: |
          cd mobile
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r FamilySoul伴侣_iOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilySoul伴侣_iOS_未签名安装包
          path: mobile/build/ios/iphoneos/FamilySoul伴侣_iOS.ipa
          retention-days: 7
